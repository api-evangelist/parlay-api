name: ParlayAPI MCP Server
description: Official first-party MCP server (parlayapi-mcp) exposing sports odds,
  props, prediction-market data, live previews, source-quality proof, and agent
  signup as 22 tools. Local stdio transport only — no hosted/remote endpoint is
  published. Distributed on PyPI, as a Claude Desktop .mcpb bundle, and registered
  in the official MCP registry as io.github.JacobiusMakes/parlayapi. Nine tools
  work keyless (signup, checkout-link, magic-link, pricing, live previews, source
  quality, coverage); the rest need a PARLAYAPI_KEY API key.
status: official
deployment:
  mode: local-stdio
  install: uvx parlayapi-mcp
  package: https://pypi.org/project/parlayapi-mcp/
  auth: api-key
  verified: searched
registry: io.github.JacobiusMakes/parlayapi
repository: https://github.com/JacobiusMakes/parlay-api-mcp
version: 0.3.6
published: '2026-09-07'
transport: stdio
environment:
- name: PARLAYAPI_KEY
  required: false
  note: Optional; keyless mode still serves signup, pricing, live preview,
    source-quality and coverage tools. PARLAY_API_KEY also accepted.
- name: PARLAYAPI_BASE_URL
  required: false
  note: Override for local development.
