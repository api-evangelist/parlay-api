  /v1/meta/changelog:
    get:
      summary: Meta Changelog Json
      description: 'Machine-readable changelog. Public, no auth, no credits.


        Returns an ordered list of changelog entries (newest first). Each

        entry has `date` (ISO 8601 yyyy-mm-dd), `title`, `tags` (list of

        short strings), `summary` (first paragraph as plain text), and

        `url` (anchor into the human-readable HTML page).


        Use cases:

        - SDK release-notes banner: poll once per deploy, show new entries

        since last seen `worker_started_at`.

        - Customer dashboard "what''s new" widget.

        - AI agent summarizing platform changes in conversation.

        - Slack / Discord bot in your team channel mirroring updates.


        The HTML page at /changelog and RSS feed at /changelog.rss share

        this same source-of-truth (static/changelog.html), so all three

        surfaces are guaranteed in sync.'
      operationId: meta_changelog_json_v1_meta_changelog_get
