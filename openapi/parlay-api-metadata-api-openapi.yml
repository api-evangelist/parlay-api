        Response shape:

        {

        "as_of": "...",

        "query": "lakers",

        "sport_key": null,

        "hours_ahead": 168,

        "result_count": N,

        "results": [

        {"sport_key":"...","commence_time":"...",

        "home_team":"...","away_team":"...",

