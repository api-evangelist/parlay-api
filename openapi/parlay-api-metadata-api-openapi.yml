  /v1/meta/diagnostic:
    get:
      summary: Meta Diagnostic
      description: 'Customer-facing connectivity diagnostic. Returns everything the

        caller needs to debug "why can''t I reach the API."


        Public, no auth, no credits. The endpoint is intentionally simple

        so a misconfigured firewall / ISP filter / corporate proxy can be

        distinguished from a real outage. Pair with /diag (HTML) which

        runs every check from the browser and renders results.


        Response shape:

        {

        "as_of": "...", // server-side time

        "as_of_unix": 1234567890,

        "client_ip": "...",

        "client_country_hint": "...", // IP geo if available

        "client_asn_hint": "...", // ASN if available

        "request_received_via": {

        "scheme": "https",

        "host": "parlay-api.com",

        "user_agent": "..."

        },

        "expected_signature": "PARLAY-OK-2026", // string the

        // browser can grep for

        "tls_fingerprint": null, // not yet

        "headers_we_set_back": {...}, // CORS, CSP, etc.

        "tests": [

        {"name":"server_time", "ok":true, "note":"..."},

        {"name":"tls_active", "ok":true, "note":"..."},

        {"name":"cors", "ok":true, "note":"..."},

        ...

        ]

        }


        If a customer can hit this endpoint at all, their network can reach

        us. If they cannot (DNS NXDOMAIN, ISP filter HTML, timeout, etc.)

        they know it''s NOT us and they need to look at their network path.'
      operationId: meta_diagnostic_v1_meta_diagnostic_get
