      operationId: meta_event_search_v1_meta_event_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          description: Search query. Matches against home_team, away_team, or both.
          title: Q
        description: Search query. Matches against home_team, away_team, or both.
      - name: sport_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional sport filter (e.g. baseball_mlb).
          title: Sport Key
        description: Optional sport filter (e.g. baseball_mlb).
      - name: hours_ahead
        in: query
        required: false
        schema:
          type: integer
          maximum: 720
          minimum: 1
          description: Only return events with commence_time within the next N hours (default 168=7 days).
          default: 168
          title: Hours Ahead
        description: Only return events with commence_time within the next N hours (default 168=7 days).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max results to return (default 20).
          default: 20
          title: Limit
        description: Max results to return (default 20).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
