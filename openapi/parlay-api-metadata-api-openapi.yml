  /v1/meta/api-key-check:
    get:
      summary: Meta Api Key Check
      description: 'Validate an API key without consuming credits. Useful for

        CI/CD pre-flight, signup-flow validation, and SDK boot-time

        sanity checks.


        Pass the key via the same channels as any authenticated endpoint:

        `X-API-Key` header, `Authorization: Bearer `, or

        `?apiKey=...` query param.


        No credit cost. Returns the tier, active state, credit headroom,

        and a `valid` boolean. Distinguishes 4 outcomes:

        - 200 `{"valid": true, ...}` for a healthy key

        - 200 `{"valid": false, "reason": "..."}` for an invalid key

        (this lets CI scripts treat invalid-key as a soft failure

        without parsing 401 envelopes)

        - 200 `{"valid": false, "reason": "credit_exhausted", ...}`

        for a key that is structurally valid but has burned its

        monthly allowance

        - 200 `{"valid": false, "reason": "key_inactive", ...}` for

        a key that has been deactivated by the owner'
