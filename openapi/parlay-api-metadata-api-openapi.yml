openapi: 3.2.0
info:
  title: Parlay Metadata API
  description: Real-time sports odds aggregation from **33 books and data sources** updated every 2-120 seconds depending on source cadence.
  version: 3.2.0
  x-credit-currency: credits
  x-credit-cost-catalogue-url: /v1/meta/credit-costs
  x-pricing-url: /v1/pricing
  x-usage-url: /v1/usage
  contact:
    name: ParlayAPI support
    url: https://parlay-api.com/support
    email: support@parlay-api.com
  license:
    name: ParlayAPI Terms of Service
    url: https://parlay-api.com/terms
  termsOfService: https://parlay-api.com/terms
servers:
- url: https://parlay-api.com
  description: Production (primary; HTTP/2, TLS 1.3).
- url: https://api.parlay-api.com
  description: Production (high-volume; bypasses Cloudflare edge for trading bots above 30 req/min). Same origin, same auth, same endpoints.
tags:
- name: Metadata
  description: 'Machine-readable platform metadata: pricing, SLA, incidents, uptime, credit costs.'
paths:
  /v1/meta/api-info:
    get:
      summary: Api Info
      description: 'Platform metadata in one call. Public, no auth, no credits.


        Use this to:

        - Detect deploys: version + worker_started_at change after a

        rolling reload. Trigger reconnect / cache refresh on a change.

        - Health-check externally with a single endpoint that summarizes

        version, source coverage, endpoint count, and links.

        - Programmatically discover docs / OpenAPI / AsyncAPI URLs.


        Cheap to call. Server-side computation: a few dict literals plus

        one `len(app.routes)`. No DB hits.'
      operationId: api_info_v1_meta_api_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/credit-costs:
    get:
      summary: Credit Costs
      description: 'Machine-readable per-endpoint credit cost catalogue. Public,

        no auth, no credits charged.


        Use cases:

        - Build a cost calculator in your app ("this analysis will use

        N credits").

        - Estimate monthly burn before committing to a tier.

        - Drive a usage dashboard alongside `/v1/usage` (current spend)

        and `/v1/pricing` (tier credit allowance).


        Response shape:

        {

        "currency": "credits",

        "version": "0.1",

        "fixed": [{method, path, cost, desc}, ...],

        "variable": [{method, path, cost_formula, cost_floor, example, desc}, ...],

        "free_examples": [path, ...],

        "notes": [...]

        }


        Stability promise: the keys `currency`, `version`, `fixed`,

        `variable`, `free_examples` will not be removed or renamed. Per-

        endpoint costs may change with notice via /changelog. The

        `version` field bumps when a breaking schema change happens.


        sleep_iter_21 #520: emits ETag + supports If-None-Match for 304

        Not-Modified responses. SDK clients with conditional-GET wiring

        skip transferring the body when the cost catalogue hasn''t

        changed since the last fetch.'
      operationId: credit_costs_v1_meta_credit_costs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/quote:
    post:
      summary: Quote Credits
      description: 'Preview the credit cost of a request without executing it.


        Public, no auth, no credits charged.


        Request body:

        ```

        {

        "method": "GET",

        "path": "/v1/sports/baseball_mlb/odds",

        "query": {"markets": "h2h,spreads", "regions": "us"}

        }

        ```


        Response:

        ```

        {

        "estimated_credits": 2,

        "cost_basis": "len(markets)=2 x len(regions)=1",

        "cost_type": "variable",

        "matched_template": "/v1/sports/{sport_key}/odds",

        "description": "Multi-market multi-region odds",

        "cost_floor": 1

        }

        ```


        Use cases:

        - Batch analysis budgeting: estimate cost of running an

        analysis across N events before committing.

        - Tier upgrade planning: see how much a typical workflow

        costs before subscribing.

        - SDK helper: client.estimate_cost(params) before

        client.get_odds(params).


        For fixed-cost endpoints, this just looks up the cost. For

        variable-cost endpoints, it parses the query and applies the

        formula from _CREDIT_COSTS.


        sleep_iter_48 #546.'
      operationId: quote_credits_v1_meta_quote_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Payload
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/batch-quote:
    post:
      summary: Batch Quote Credits
      description: 'Batch credit-cost preview. Public, no auth, no credits.


        Request body:

        ```

        {

        "requests": [

        {"method": "GET", "path": "/v1/sports/baseball_mlb/odds", "query": {"markets": "h2h"}},

        {"method": "GET", "path": "/v1/sports/baseball_mlb/props", "query": {}},

        {"method": "POST", "path": "/v1/parlay/price", "query": {"legs_count": "3"}},

        ...

        ]

        }

        ```


        Response:

        ```

        {

        "total_estimated_credits": 42,

        "request_count": 3,

        "per_request": [

        {"index": 0, "estimated_credits": 1, "cost_type": "variable", ...},

        {"index": 1, "estimated_credits": 3, "cost_type": "fixed", ...},

        {"index": 2, "estimated_credits": 6, "cost_type": "variable", ...}

        ],

        "errors": []

        }

        ```


        Use cases:

        - Planning a batch script: estimate total cost across N

        calls before committing.

        - Tier upgrade calculator: simulate a typical month of

        calls, compare to tier.credits_per_month.

        - SDK helper: client.estimate_batch(requests) before

        asyncio.gather(*[client.request(r) for r in requests]).


        Cap of 500 requests per batch to prevent abuse.


        sleep_iter_52 #550.'
      operationId: batch_quote_credits_v1_meta_batch_quote_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Payload
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/sla:
    get:
      summary: Get Sla
      description: 'Machine-readable SLA targets. Public, no auth, no credits.


        Returns the operational targets ParlayAPI commits to plus the

        measured baselines (latency p50s, support response times,

        maintenance / data retention policy). Procurement and security

        review teams ingest this for vendor evaluation.


        Numbers reflect operational reality, not aspirational targets.

        Latency p50s are measured from the public URL; uptime

        targets reflect what the current architecture can sustain.


        sleep_iter_28 #527: emits ETag + supports If-None-Match. Changes

        only when the SLA document itself is edited (a contract event,

        not a per-request event), so 1h cache + conditional GET is the

        right shape.


        Stability promise: keys at the top level

        (`version`, `uptime_target_per_month`, `latency_targets_p50_ms`,

        `support_response_time_hours`, `maintenance_window_policy`,

        `data_retention`, `incident_response`) will not be removed or

        renamed without bumping `version`.'
      operationId: get_sla_v1_meta_sla_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/sdks:
    get:
      summary: Get Sdks
      description: 'Machine-readable SDK catalogue. Public, no auth, no credits.


        Returns:

        - first_party: SDKs we publish ourselves (parlayapi-mcp on PyPI)

        - generators: official OpenAPI/AsyncAPI generator commands

        - integrations: MCP, Postman, Insomnia, etc.


        Lets customers and AI agents discover the right integration

        path without reading the /docs page. The OpenAPI extensions

        from iter_19 (x-credit-cost) and iter_24 (servers,

        securitySchemes) make every generated SDK fully-typed,

        cost-aware, and auth-pre-plumbed.


        sleep_iter_38 #537: emits ETag + supports If-None-Match.

        Changes only when SDK landscape shifts (a new official SDK,

        a new supported generator language).'
      operationId: get_sdks_v1_meta_sdks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/source-capabilities:
    get:
      summary: Source Capabilities
      description: 'Machine-readable source capability matrix. Public, no auth,

        no credits.


        Returns:

        - `sources[]`: per-source entry with key, title, region, status,

        capabilities (list of supported categories), aliases_to (if

        applicable)

        - `by_capability{}`: inverse index for each capability type,

        listing all sources that support it

        - `capabilities[]`: canonical list of capability category names


        Example use cases:

        - Customer building a "best book for NBA props" comparison: filter

        by_capability.props ∩ regions==us

        - SDK init: cache the matrix, then locally filter when user picks

        a market type

        - AI agent: answer "which books carry NHL game-line live odds?"

        in one fetch


        sleep_iter_53 #551: emits ETag + supports If-None-Match.

        Source landscape changes only when we add a new book or flip a

        status; ETag round-trips work for SDK boot polling.'
      operationId: source_capabilities_v1_meta_source_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/endpoints:
    get:
      summary: List Endpoints
      description: 'Lean endpoint catalogue. Public, no auth, no credits.


        Returns the same path + method + tag + summary + credit-cost info

        as /openapi.json but stripped of request/response schemas. ~10 KB

        payload vs ~194 KB for the full spec. SDK clients fetching this

        at boot for "what endpoints exist?" save bandwidth.


        Each entry:

        - path: templated URL ("/v1/sports/{sport_key}/odds")

        - method: HTTP verb (GET, POST, etc.)

        - tags: list of canonical tags from iter_35

        - summary: short description (when set in route docstring)

        - description: full prose (truncated to 200 chars)

        - deprecated: bool (iter_47 OpenAPI deprecation flag)

        - x-credit-cost: int for fixed-cost endpoints

        - x-credit-cost-type: "fixed" | "variable" | absent (free)

        - x-credit-cost-description: short capability summary


        Optional filters: ?tag=Metadata, ?method=POST.


        sleep_iter_55 #552: emits ETag + supports If-None-Match.

        Changes only when OpenAPI schema regenerates (deploy or

        schema-edit).'
      operationId: list_endpoints_v1_meta_endpoints_get
      parameters:
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to endpoints carrying this tag (e.g. 'Metadata', 'Calculators', 'Sports & Odds').
          title: Tag
        description: Filter to endpoints carrying this tag (e.g. 'Metadata', 'Calculators', 'Sports & Odds').
      - name: method
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to a specific HTTP method (GET, POST, etc.).
          title: Method
        description: Filter to a specific HTTP method (GET, POST, etc.).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/webhooks:
    get:
      summary: Webhooks Spec
      description: 'Machine-readable webhook specification. Public, no auth,

        no credits.


        Returns:

        - `events[]`: canonical event type list with descriptions

        - `signing`: HMAC scheme, header format, verification snippet

        - `retry_policy`: attempts + backoff + auto-disable rules

        - `tier_gate`: which tiers can use webhooks

        - `management`: full CRUD endpoint URLs

        - `delivery`: payload shape + headers we send


        Customers building event-driven integrations get the full

        spec in one fetch instead of reading docs HTML.


        Industry pattern: Stripe, Twilio, GitHub all publish their

        webhook spec at a discoverable URL. We follow the same shape.


        sleep_iter_56 #553: emits ETag + supports If-None-Match.'
      operationId: webhooks_spec_v1_meta_webhooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/provider-state:
    get:
      summary: Provider State
      description: 'Per-source provider-state metadata. Machine-readable freshness +

        role for every data source we currently ingest from. No API key

        required, no credits charged. Polls cheap: 5s server-side cache.


        Response shape:


        {

        "ts": 1778735000,

        "src": {

        "pinnacle": {"age_s": 1.2, "role": "primary"},

        "draftkings": {"age_s": 3.8, "role": "primary"},

        "fanduel": {"age_s": 47, "role": "degraded"},

        "caesars": {"age_s": null, "role": "offline"}

        }

        }


        Role values:

        primary last write within source''s expected polling window

        degraded last write within 3x the window; data may be stale

        offline last write past 30x window, or no recent writes seen


        Each /v1/* response also includes this in the `X-Provider-State`

        header, so most clients can avoid this endpoint entirely. Hit this

        endpoint directly only when you want the full untruncated payload

        (the header is capped at ~2 KB to fit HTTP limits).'
      operationId: provider_state_v1_meta_provider_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/source-quality:
    get:
      summary: Source Quality
      description: 'Per-source speed and quality metadata. Public, no auth, no credits.


        This complements /v1/meta/provider-state with an operator-grade

        view over recent write activity across odds, props, and period

        markets. It returns SLA state, age, observed row counts, and the

        next recommended cadence action for each source.


        The endpoint reads metadata only. It does not create, modify, or

        infer prices.'
      operationId: source_quality_v1_meta_source_quality_get
      parameters:
      - name: minutes
        in: query
        required: false
        schema:
          type: integer
          maximum: 1440
          minimum: 1
          default: 10
          title: Minutes
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 40
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/source-health:
    get:
      summary: Source Health Alias
      description: 'Compatibility alias for /v1/meta/source-quality.


        Operators and older docs often say "source health" when referring

        to this payload. Keep the alias live so quick diagnostics do not

        404 during an incident.'
      operationId: source_health_alias_v1_meta_source_health_get
      parameters:
      - name: minutes
        in: query
        required: false
        schema:
          type: integer
          maximum: 1440
          minimum: 1
          default: 10
          title: Minutes
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 40
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/collector-flush:
    get:
      summary: Collector Flush Meta
      description: 'Latest collector flush telemetry. Public, no auth, no credits.


        Shows whether the database writer is keeping up with the fetchers:

        elapsed flush time, rows written by kind, remaining queue depth, and

        per-source contributors. This is the first place to look when

        source pulses are fresh but price-write timestamps lag behind.'
      operationId: collector_flush_meta_v1_meta_collector_flush_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/latest-state:
    get:
      summary: Latest State Meta
      description: 'Redis latest-state telemetry. Public, no auth, no credits.


        This is the hot lane ahead of Postgres archive flush: latest

        accepted row by source plus collector-lag percentiles. It is

        observability only and does not derive, modify, or backfill prices.'
      operationId: latest_state_meta_v1_meta_latest_state_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      - name: latency_window_s
        in: query
        required: false
        schema:
          type: integer
          maximum: 3600
          minimum: 60
          default: 900
          title: Latency Window S
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/per-book-sla:
    get:
      summary: Meta Per Book Sla
      description: 'Per-book freshness SLA thresholds. Public, no auth, no credits.


        Returns the (tight_s, slack_s, stale_s) thresholds used to classify

        each source as ok / degraded / breach / stale in the source-quality

        payloads. Customers integrating against /v1/meta/source-quality use

        this to know what `sla=degraded` actually means for a given book

        (e.g. "Pinnacle tight=5s, Bovada tight=30s, PrizePicks tight=60s").


        Memory rule compliance: read-only on already-public threshold

        config. No prices touched.'
      operationId: meta_per_book_sla_v1_meta_per_book_sla_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/meta/parser-coverage:
    get:
      summary: Meta Parser Coverage
      description: 'Per-book per-sport market-coverage matrix. Public, no auth, no credits.


        Answers the customer question "which markets do you actually parse

        from Caesars on NBA?" or "what markets does Pinnacle expose on

        table_tennis?" by aggregating observed market_keys from the

        prop_snapshots and odds_snapshots tables over the requested

        window.


        Returns:

        {

        "as_of": "...",

        "window_hours": 72,

        "book_count": 32, // operators, the keys /odds serves

        "source_count": 45, // raw ingest feeds behind them

        "variants": {"unibet": ["unibet", "unibet_au", ...], ...},

        "by_book": {

        "draftkings": {

        "baseball_mlb": {

        "markets": ["player_home_runs", "player_strikeouts", ...],

        "row_count": 14821,

        "latest_age_s": 12.3

        },

        ...

        },

        ...

        }

        }


        `book_count` counts operators, not feeds: an operator that publishes

        country-licensed feeds off one platform (Kindred runs 14 Unibet feeds)

        is one book, the same one /odds and /props serve. Its markets are the

        union of its feeds'' markets and its row_count their sum. `source_count`

        keeps the raw feed total visible and `variants` names the members, so

        nothing is hidden by the fold. Naming one feed with ?source= returns it

        under its own name.


        Memory rule compliance: read-only on metadata. No prices touched.'
      operationId: meta_parser_coverage_v1_meta_parser_coverage_get
      parameters:
      - name: window_hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 720
          minimum: 1
          default: 72
          title: Window Hours
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional filter to one book.
          title: Source
        description: Optional filter to one book.
      - name: sport_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional filter to one sport.
          title: Sport Key
        description: Optional filter to one sport.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/book-coverage:
    get:
      summary: Meta Book Coverage
      description: 'Per-book coverage gates across game, prop, and period markets.


        Public, no auth, no credits. This is the machine-readable proof

        surface behind the coverage dashboard: every current book/sport/kind

        row gets source freshness, normalization, database, REST-shape, and

        stream-shape gates.'
      operationId: meta_book_coverage_v1_meta_book_coverage_get
      parameters:
      - name: window_minutes
        in: query
        required: false
        schema:
          type: integer
          maximum: 1440
          minimum: 5
          default: 15
          title: Window Minutes
      - name: include_warn
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Warn
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/pricing:
    get:
      summary: Get Pricing
      description: 'Public pricing endpoint. Returns the tier table for programmatic

        integration (Stripe widgets, AI agents, comparison pages, the JSON

        side of the HTML /pricing page). No API key required.


        sleep_iter_21 #520: emits ETag + supports If-None-Match. Pricing

        changes rarely (a few times a year at most). Clients with

        conditional-GET wiring skip the body on 304.'
      operationId: get_pricing_v1_pricing_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/status:
    get:
      summary: Status Json
      description: '**Public, no-auth.** Live endpoint health: per-source freshness,

        request-rate-log p50/p95, total request count last hour.


        Same data the /status page renders. Refreshes every 90 seconds.


        Cached 90s with stale-while-revalidate plus background refresh, so a

        request never blocks on the heavy per-source aggregate. Warm cache is

        served directly; a stale cache is served immediately while one worker

        recomputes off the request path; only a truly cold cache computes inline,

        single-flighted and time-bounded so a slow aggregate returns a quick 503

        instead of hanging into a proxy 500. (Pre-fix, concurrent cold polls each

        ran the same ~3s aggregate at once; I/O contention inflated every one to

        ~18s and tripped the worker timeout into 500s.)'
      operationId: status_json_v1_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Metadata
  /v1/status/history:
    get:
      summary: Status History
      description: 'Trailing-window SLA history per source. Public, no auth.


        Pairs with /v1/status (which is point-in-time). This endpoint

        returns the timeline that backs the /status page''s uptime chart.

        Default window is 24 hours (86400s). Max is 7 days.


        Memory rule compliance: returns metadata only (SLA classification

        + age). No prices touched. Reads from a Redis ring buffer populated

        by the collector''s source_quality_history_loop; the buffer is

        bounded so the endpoint cost is constant regardless of uptime.


        An empty `sources` always comes with a `_note` saying why, and

        `newest_sample_age_s` when the buffer holds samples older than the

        requested window, so a stopped sampler is distinguishable from a quiet

        one without opening a support ticket.


        Returns:

        {

        "as_of": "...",

        "window_s": 86400,

        "sources": {

        "pinnacle": [

        {"ts": ..., "sla": "ok", "age_s": 4.2},

        ...

        ],

        ...

        }

        }'
      operationId: status_history_v1_status_history_get
      parameters:
      - name: window_s
        in: query
        required: false
        schema:
          type: integer
          maximum: 604800
          minimum: 300
          default: 86400
          title: Window S
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional single source to return.
          title: Source
        description: Optional single source to return.
      responses:
        '200':
