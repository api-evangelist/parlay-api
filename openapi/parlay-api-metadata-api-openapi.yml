  /v1/meta/incidents:
    get:
      summary: Incidents Json
      description: 'Machine-readable incident history. Public, no auth, no credits.


        Returns an ordered list of platform incidents (most recent first)

        with start / resolved timestamps, impact summary, root cause,

        resolution, affected endpoints. Customers ingest this for:


        - Vendor reliability scoring matrix.

        - SLA-compliance verification (the times we missed our targets).

        - Status-page rollups (some customers render their own).

        - AI agent answering "has ParlayAPI been reliable recently?"


        Empty / short record is itself a meaningful signal — the absence

        of incidents over a long window indicates a stable platform.


        Source-of-truth is src/api/static/incidents.json (human-edited,

        git-versioned). Each incident has a stable `id` so customers

        can dedupe across polls.


        Stability promise: `id`, `title`, `status`, `severity`,

        `started_at`, `resolved_at`, `impact` keys will not be removed

        or renamed without bumping `version`.'
      operationId: incidents_json_v1_meta_incidents_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by status: ''resolved'' (closed), ''investigating'', ''identified'', ''monitoring'', ''open'' (all non-resolved). Omit for all.'
          title: Status
        description: 'Filter by status: ''resolved'' (closed), ''investigating'', ''identified'', ''monitoring'', ''open'' (all non-resolved). Omit for all.'
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO 8601 date (YYYY-MM-DD) to filter incidents started on or after this date.
          title: Since
        description: ISO 8601 date (YYYY-MM-DD) to filter incidents started on or after this date.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
  /v1/meta/uptime:
    get:
      summary: Uptime Stats
      description: 'Per-worker request counters since worker boot. Public, no

        auth, no credits.


        Returns:

        - total_requests: every request the worker has served

        - by_status_class: {2xx, 3xx, 4xx, 5xx}

        - error_rate_pct: 5xx / total * 100 (server-error rate)

        - success_rate_pct: 2xx / total * 100

        - server_error_first_at / server_error_last_at: timestamps of

        first/last 5xx (null if none)

        - worker_started_at + worker_uptime_seconds (matches api-info)


        Reset on every rolling reload (per-worker, in-process). The 5-

        worker pool means a customer polling sees one worker''s stats per

        poll. Over time the round-robin load balancer surfaces a

        representative sample.


        For a cross-worker aggregate uptime % a future iter could push

        these counters to Redis on a periodic flush. For now the per-

        worker view is the meaningful signal: "is this worker healthy?"


        Pairs with /v1/meta/sla (targets) + /v1/meta/incidents (record

        of misses). All three discoverable through /v1/meta/api-info.


        Stability: this is /v1/meta/uptime version 0.1. Keys may evolve.'
      operationId: uptime_stats_v1_meta_uptime_get
      parameters:
      - name: by_endpoint
        in: query
        required: false
        schema:
          type: boolean
          description: If true, include per-endpoint breakdown (templated paths only, capped at 200).
          default: false
          title: By Endpoint
        description: If true, include per-endpoint breakdown (templated paths only, capped at 200).
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          description: 'When by_endpoint=true: sort by ''5xx'' (default; descending), ''total'' (descending), or ''path'' (alphabetical).'
          default: 5xx
          title: Sort By
        description: 'When by_endpoint=true: sort by ''5xx'' (default; descending), ''total'' (descending), or ''path'' (alphabetical).'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: 'When by_endpoint=true: cap on number of endpoints in response.'
          default: 50
          title: Limit
        description: 'When by_endpoint=true: cap on number of endpoints in response.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Metadata
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key passed in the X-API-Key header. Recommended.
    apiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: API key passed as the ?apiKey= query parameter. Useful for browser fetch() and webhooks where header control is limited. Equivalent to X-API-Key.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
      description: 'API key passed via Authorization: Bearer <key>. Equivalent to X-API-Key for compatibility with auth libraries that expect bearer tokens.'
