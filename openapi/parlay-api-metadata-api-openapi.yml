  /v1/meta/book-catalog:
    get:
      summary: Meta Book Catalog
      description: 'Full registered-book catalog with class labels and ingest status.


        Sister to /v1/meta/source-stack: where source-stack is curated and

        deep (full integration metadata for each book we''ve genuinely

        wired live), this endpoint is breadth-oriented and surfaces every

        book in the classification registry alongside a `live` flag

        indicating whether it''s currently producing rows.


        Use cases:

        - Customer auditing "do you cover sportsbook X?" with one HTTP

        GET instead of having to read the source-stack and figure out

        what''s missing

        - AI agents enumerating coverage for a comparison page

        - Operators identifying which scaffolded modules haven''t yet

        been promoted to live ingest


        Response shape:

        {

        "as_of_iso": "...",

        "aggregate": {

        "books_total": N, // every key in classification registry

        "books_live": N, // subset currently producing rows

        "books_scaffolded_not_live": N,

        "by_class": {"us_retail": N, "uk": N, ...},

        "by_class_with_live": {

        "us_retail": {"total": N, "live": N}, ...

        }

        },

        "books": [

        {

        "key": "fanduel",

        "class": "us_retail",

        "title": "FanDuel", // display name from BOOKMAKER_TITLES

        "live": true, // saw rows in last 24h

        "rows_24h": N, // 0 if not live

        "variants": [...], // feeds folded in; absent if just one

        "variant_of": "unibet" // absent unless this key IS a variant

        },

        ...

        ]

        }


        rows_24h is credited to the OPERATOR: a book''s country-licensed feeds

        (unibet_se, unibet_ro, ...) count toward the book /odds serves, and

        `variants` names them. Two Unibet variants are registered in their own

        right and keep their own rows; they carry `variant_of` so counting

        operators means counting `variant_of or key`.


        Public, no auth, no credits. 5-minute server-side cache so

        polling is cheap; live counts refresh on a 5-min cadence.'
      operationId: meta_book_catalog_v1_meta_book_catalog_get
      parameters:
      - name: class
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to a single class (e.g. us_retail, uk, br, exchange). Omit for all classes.
          title: Class
        description: Filter to a single class (e.g. us_retail, uk, br, exchange). Omit for all classes.
      - name: live
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'true: only books that produced rows in past 24h. false: only scaffolded-not-live. Omit for all.'
          title: Live
        description: 'true: only books that produced rows in past 24h. false: only scaffolded-not-live. Omit for all.'
      - name: region
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to books with this region tag (e.g. US-NJ, BR, ES, FR, DE, AU). Matches against the regions list of each entry in /v1/meta/source-stack (when available).
          title: Region
        description: Filter to books with this region tag (e.g. US-NJ, BR, ES, FR, DE, AU). Matches against the regions list of each entry in /v1/meta/source-stack (when available).
      responses:
        '200':
          description: Successful Response
          content:
