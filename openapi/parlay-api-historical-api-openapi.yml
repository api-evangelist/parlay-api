        key is enforced by a unique constraint on prop_closing_lines so

        duplicate rows are impossible; each row is the latest-snapshot

        archive for that prop close.


        Designed for backtesters who want a flat-file daily snapshot

        rather than the JSON shape of /v1/sports/{sport_key}/closing-lines.


        Headers: text/csv; Content-Disposition attachment named by date.

        Stream-safe for large windows up to limit=500000 rows.


        The two trailing columns, `retired` and `closed_on`, are filled only

        on rows from a retired book (an operator that has closed; see

        RETIRED_SOURCES) and empty everywhere else, so the JSON twin and this

        file say the same thing about the same row.


        Memory rule compliance: every row comes from prop_closing_lines,

        which only carries observed closing snapshots. We never synthesize

