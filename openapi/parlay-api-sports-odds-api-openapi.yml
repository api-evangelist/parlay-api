        `daysFrom` beyond it returns 403 HISTORICAL_LIMIT.


        **Example:** `GET /v1/sports/soccer_epl/closing-lines?bookmakers=pinnacle&daysFrom=7`


        Response includes h2h (3-way with draw for soccer), spreads, and totals.

        Each event includes the bookmaker''s last update timestamp before kickoff.'
