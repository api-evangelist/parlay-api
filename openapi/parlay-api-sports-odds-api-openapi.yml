      x-credit-cost-type: fixed
      x-credit-cost-description: Live play-by-play state snapshot
      security:
      - apiKeyHeader: []
      - apiKeyQuery: []
      - bearerAuth: []
      tags:
      - Sports & Odds
  /v1/sports/{sport_key}/live/book_latency:
    get:
      summary: Sports Live Book Latency
      description: 'Per-book latency for live games in this sport.


        For each book (DK / FD / Caesars / BetMGM / Pinnacle / etc.) we

        compute lag_seconds = primary_PBP_age - book_odds_last_update.

        Positive lag means the book is behind reality (their lines might be

        stale; exploit before rebalance).


        Use case: arb scanner customers query this every few seconds and

        surface "FD has 8s lag on Yankees-Rangers right now" alerts.


        Pro+ tier. 5 credits per call (rich derived data).'
      operationId: sports_live_book_latency_v1_sports__sport_key__live_book_latency_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: apiKey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
          title: Apikey
        description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-credit-cost: 5
      x-credit-cost-type: fixed
      x-credit-cost-description: Per-book lag relative to live game state
      security:
      - apiKeyHeader: []
      - apiKeyQuery: []
      - bearerAuth: []
      tags:
      - Sports & Odds
  /v1/sports/{sport_key}/live/source-health:
    get:
      summary: Sports Live Source Health
      description: 'Customer-facing source-freshness diagnostic.


        Returns per-source freshness for the requested sport: which feeds

        are emitting events, when they last did, and how many events landed

        in the last 5 minutes. Use this to detect when a source goes stale

        so your bot doesn''t trade on dead data.


        Response shape (one row per source actively emitting for this sport):

        [

        {

        "sport_key": "basketball_nba",

        "source": "nba_live",

        "role": "primary",

        "events_last_5min": 142,

        "seconds_since_last_event": 3.2,

        "latest_capture_ms": 1778214028111

        },

        ...

        ]


        Free tier OK. 1 credit per call. Recommended polling cadence: every

        30 seconds. If a source you care about shows seconds_since_last_event

        > 60 during a known-live game, that source has gone stale; failover

        to another source or the league-API path.


        **Empty-when-healthy semantics** (iter_064 #479): the pbp_source_health

        table is populated by the source-health monitor only when a feed

        transitions into a degraded state (slow / silent / errored). A

        response of `{count: 0, results: []}` means every tracked source

        for the sport is firing within its expected cadence. Treat empty

        as a positive signal, not a missing-data signal. To verify the

        underlying source is actually live, cross-reference

        `/live/api/data_flow` which always returns the per-source pulse

        snapshot.'
      operationId: sports_live_source_health_v1_sports__sport_key__live_source_health_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: apiKey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
          title: Apikey
        description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-credit-cost: 1
      x-credit-cost-type: fixed
      x-credit-cost-description: Per-sport live source freshness diagnostic
      security:
      - apiKeyHeader: []
      - apiKeyQuery: []
      - bearerAuth: []
      tags:
      - Sports & Odds
  /v1/sports/{sport_key}/live/period_markets:
    get:
      summary: Sports Live Period Markets
      description: 'Return latest period market lines for a sport.


        Open to all tiers. 2 credits per call.


        The apiKey query param above is declared OPTIONAL on purpose. It used

        to be `Query(...)`, which made FastAPI 422 "Field required" before

        this body ever ran whenever a customer sent the key the way docs.html

        recommends (X-API-Key header) or as Authorization: Bearer. Leaving it

        optional lets require_api_key below resolve all three forms, with

        headers beating query so an appended &apiKey= cannot clobber a key

        sent securely.'
      operationId: sports_live_period_markets_v1_sports__sport_key__live_period_markets_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: period
        in: query
        required: false
        schema:
          type: string
          description: FT / 1H / 2H / Q1 / Q2 / Q3 / Q4 / OT or 'all'
          default: all
          title: Period
        description: FT / 1H / 2H / Q1 / Q2 / Q3 / Q4 / OT or 'all'
      - name: match_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional source-native match id
          title: Match Id
        description: Optional source-native match id
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional book filter
          title: Source
        description: Optional book filter
      - name: market
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional market filter (spread/total/h2h)
          title: Market
        description: Optional market filter (spread/total/h2h)
      - name: apiKey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
          title: Apikey
        description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-credit-cost: 2
      x-credit-cost-type: fixed
      x-credit-cost-description: In-game period spreads, totals, and h2h
      security:
      - apiKeyHeader: []
      - apiKeyQuery: []
      - bearerAuth: []
      tags:
      - Sports & Odds
  /v1/sports/{sport_key}/live/disagreement:
    get:
      summary: Sports Live Disagreement
      description: 'Cross-book disagreement diagnostic for in-play markets.


        Returns one row per (match, period, market, side) with each book''s

        latest line + price plus deviation from a chosen anchor (median or

        Pinnacle). Use this to find +EV opportunities during fast scoring

        runs where soft books haven''t caught up to sharp lines yet.


        Tier gate: Pro+. 5 credits per call.


        Example response (basketball_nba Q3 total):

        {

        "sport_key": "basketball_nba",

        "period": "Q3",

        "market": "total",

        "anchor": "median",

        "as_of_ms": 1778342828915,

        "results": [

        {

        "match_id": "0042500301",

        "home_team": "Lakers", "away_team": "Thunder",

        "side": "over",

        "anchor_line": 51.5,

        "books": [

        {"source": "pinnacle", "line": 51.5, "price": -110,

        "deviation_abs": 0.0, "deviation_pct": 0.0,

        "age_seconds": 2.1},

        {"source": "dk_web", "line": 50.5, "price": -115,

        "deviation_abs": 1.0, "deviation_pct": 0.0194,

        "age_seconds": 1.4}

        ]

        }

        ]

        }


        Filter on `deviation_pct > 0.02` client-side to surface the actually

        actionable disagreements (anything within median noise gets dropped).


        apiKey is optional as a query param because the key may equally be

        sent as X-API-Key or Authorization: Bearer; see the module docstring.'
      operationId: sports_live_disagreement_v1_sports__sport_key__live_disagreement_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: period
        in: query
        required: false
        schema:
          type: string
          description: FT / 1H / 2H / Q1-Q4 / OT / P1-P3 / F5 / F7 or 'all'
          default: all
          title: Period
        description: FT / 1H / 2H / Q1-Q4 / OT / P1-P3 / F5 / F7 or 'all'
      - name: market
        in: query
        required: false
        schema:
          type: string
          description: spread / total / h2h
          default: total
          title: Market
        description: spread / total / h2h
      - name: side
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional side filter (over/under for total, home/away for spread/h2h). Omit to get all sides per book.
          title: Side
        description: Optional side filter (over/under for total, home/away for spread/h2h). Omit to get all sides per book.
      - name: anchor
        in: query
        required: false
        schema:
          type: string
          description: 'Reference for deviation: ''median'' (across all books) or ''pinnacle'''
          default: median
          title: Anchor
        description: 'Reference for deviation: ''median'' (across all books) or ''pinnacle'''
      - name: max_age_s
        in: query
        required: false
        schema:
          type: integer
          maximum: 300
          minimum: 1
          description: Drop books whose latest observation is older than this many seconds. Default 90s catches Bovada's slower polling cycle alongside Pinnacle's tight one. Lower it for stricter freshness, raise it for sparse periods (deep Q4, OT).
          default: 90
          title: Max Age S
        description: Drop books whose latest observation is older than this many seconds. Default 90s catches Bovada's slower polling cycle alongside Pinnacle's tight one. Lower it for stricter freshness, raise it for sparse periods (deep Q4, OT).
      - name: min_books
        in: query
        required: false
        schema:
          type: integer
          maximum: 10
          minimum: 1
          description: Minimum number of books required to emit a row. Default 2 because rows with n_books=1 can't be disagreeing with anyone (max_deviation_pct=0 always). Pass 1 to also see markets where only one book has a recent quote (useful for diagnosing which books are slow to refresh).
          default: 2
          title: Min Books
        description: Minimum number of books required to emit a row. Default 2 because rows with n_books=1 can't be disagreeing with anyone (max_deviation_pct=0 always). Pass 1 to also see markets where only one book has a recent quote (useful for diagnosing which books are slow to refresh).
      - name: apiKey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
          title: Apikey
        description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-credit-cost: 5
      x-credit-cost-type: fixed
      x-credit-cost-description: Cross-book in-play line disagreement
      security:
      - apiKeyHeader: []
      - apiKeyQuery: []
      - bearerAuth: []
      tags:
      - Sports & Odds
