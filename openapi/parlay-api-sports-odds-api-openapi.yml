  /v1/sports/{sport_key}/consensus:
    get:
      summary: Get Consensus
      description: 'Get consensus (average) odds across all bookmakers. 3 credits.


        Returns the average odds, best odds, worst odds, and hold/vig

        for each market across all bookmakers. Useful for identifying

        where your book stands vs the market.


        The average is taken in probability space: each book''s American

        price is converted to its implied probability, those are averaged

        into `consensus_prob`, and `consensus_odds` is that probability

        converted back. Averaging American prices directly is invalid

        because the scale jumps across zero, so +150 and -150 would

        average to 0 rather than to even money.


        iter_058 #462: prediction markets are excluded from the rollup by

        default. Kalshi was producing wildly off prices like +3233 for

        ''Phillies win'' that turned out to reference a different market

        (e.g. series winner, not next game ML) and skewed consensus_odds

        to nonsense values. Use `?include_prediction_markets=true` to

        restore the prior behavior of mixing them in.'
      operationId: get_consensus_v1_sports__sport_key__consensus_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: include_prediction_markets
        in: query
        required: false
        schema:
          type: boolean
          description: Include Kalshi/Polymarket prices in the consensus rollup. Defaults to False because prediction markets often price derivative questions (e.g. 'Phillies win series') that look like h2h ML but skew the average. Set true if you specifically want their prices mixed in.
