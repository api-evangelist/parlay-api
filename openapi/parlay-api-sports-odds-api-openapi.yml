        description: Include player-total props (points, strikeouts, ...) alongside game totals + spreads. Default true.
      - name: max_width
        in: query
        required: false
        schema:
          type: number
          maximum: 50.0
          minimum: 0.0
          description: Optional cap on window width. 0 (default) = no cap. Useful to hide implausibly wide 'middles' that pair a main line with a deep, stale alternate line.
          default: 0.0
          title: Max Width
        description: Optional cap on window width. 0 (default) = no cap. Useful to hide implausibly wide 'middles' that pair a main line with a deep, stale alternate line.
      responses:
