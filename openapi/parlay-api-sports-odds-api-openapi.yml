        are MLB''s canonical Person IDs from Stats API.


        Sourced from MLB Stats API (statsapi.mlb.com) — official, free,

        no auth. Refreshed hourly.


        Open to all tiers. 1 credit per call.'
      operationId: mlb_probable_pitchers_v1_sports_baseball_mlb_probable_pitchers_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'YYYY-MM-DD. Default: all upcoming dates in cache (~3 days)'
          title: Date
