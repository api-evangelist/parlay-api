openapi: 3.2.0
info:
  title: Parlay Sports & Odds API
  description: Real-time sports odds aggregation from **33 books and data sources** updated every 2-120 seconds depending on source cadence.
  version: 3.2.0
  x-credit-currency: credits
  x-credit-cost-catalogue-url: /v1/meta/credit-costs
  x-pricing-url: /v1/pricing
  x-usage-url: /v1/usage
  contact:
    name: ParlayAPI support
    url: https://parlay-api.com/support
    email: support@parlay-api.com
  license:
    name: ParlayAPI Terms of Service
    url: https://parlay-api.com/terms
  termsOfService: https://parlay-api.com/terms
servers:
- url: https://parlay-api.com
  description: Production (primary; HTTP/2, TLS 1.3).
- url: https://api.parlay-api.com
  description: Production (high-volume; bypasses Cloudflare edge for trading bots above 30 req/min). Same origin, same auth, same endpoints.
tags:
- name: Sports & Odds
  description: Game-line and player-prop odds across all books for a sport.
paths:
  /v1/sports/{sport_key}/live/sse:
    get:
      summary: Sports Live Sse
      description: 'Server-Sent Events stream of live state changes.


        Tier-gated: paid tier (starter+). 5 credits at connection time.'
      operationId: sports_live_sse_v1_sports__sport_key__live_sse_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: match_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Match ID to subscribe to. Omit or use '*' for all live matches in this sport.
          title: Match Id
        description: Match ID to subscribe to. Omit or use '*' for all live matches in this sport.
      - name: apiKey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
          title: Apikey
        description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-credit-cost: 5
      x-credit-cost-type: fixed
      x-credit-cost-description: Live play-by-play SSE stream connection
      security:
      - apiKeyHeader: []
      - apiKeyQuery: []
      - bearerAuth: []
      tags:
      - Sports & Odds
  /v1/sports/{sport_key}/live/points:
    get:
      summary: Sports Live Points
      description: One-shot snapshot of live state. Free tier OK. 1 credit per call.
      operationId: sports_live_points_v1_sports__sport_key__live_points_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: match_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Match ID. Omit for all currently in-play matches in this sport.
          title: Match Id
        description: Match ID. Omit for all currently in-play matches in this sport.
      - name: apiKey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
          title: Apikey
        description: API key. Prefer the X-API-Key header, which keeps the key out of URLs and logs.
      responses:
        '200':
          description: Successful Response
