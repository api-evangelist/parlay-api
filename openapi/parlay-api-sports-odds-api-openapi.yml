        excluded; so is a row whose start time we cannot read, because we cannot

        attest which side of first serve it falls on. A fixture with no such

        price is therefore absent from the response rather than represented by

        an in play price. That trims coverage on books that reprice during a

        match: measured 2026-09-04 over 30 days of table tennis, 54,120 of the

        55,353 bovada side rows this endpoint used to return were quoted after

        the start time.


