  /v1/sports/{sport_key}/odds:
    get:
      summary: Get Odds
      description: 'Get odds for upcoming and live events.


        Credits: markets_count x regions_count (same formula as the-odds-api).


        **Every sport key in GET /v1/sports is supported**, including every soccer

        competition in that list, esports, and volleyball.


        **Regions:** us, us2, uk, eu, fr, au, ca, mx, latam, br, asia. Use eu for Pinnacle and European bookmakers.


        **Markets:** h2h (moneyline/3-way), spreads, totals, alternate_spreads,

        alternate_totals, outrights, and player_* / batter_* / pitcher_* /

        anytime_* / futures_* prop keys. That list is the WHOLE list this

        endpoint can return.


        **Markets served elsewhere are not billed here.** A key this endpoint

        cannot emit is still accepted and the request is still answered (a

        valid derived market never 400s here, so a migrating client''s pipeline

        is never aborted), but it is dropped from the `markets x regions`

        multiplier and costs nothing. The period keys (`h2h_1st_half`,

        `spreads_1st_half`, `totals_1st_half`, `h2h_1st_quarter`,

        `h2h_1st_period`, `h2h_1st_5_innings`, `spreads_1st_5_innings`,

        `totals_1st_5_innings`) are served by

        `/v1/sports/{sport_key}/live/period_markets?period=1H&market=h2h` and

        `/v1/historical/sports/{sport_key}/period_markets`. Team totals, BTTS,

        correct score, double chance, draw-no-bet and the racing keys are

        served by `/v1/sports/{sport_key}/props?markets=`. Until

        2026-09-05 /odds billed markets x regions for all of them and dropped

        them from the response (ticket #295).


        **What you were billed for.** Every charged response carries

        `x-markets-served`, the market keys the charge covered. A servable key

        with no book pricing it right now still costs a credit and still

        appears there: that is coverage, not a gap. Keys we cannot serve here

        are listed in `x-markets-unservable` (billed zero) and routed by

        `x-markets-served-elsewhere`.


        **Filter by bookmaker:** `?bookmakers=pinnacle,draftkings`


        **Live only:** `?live=true` returns events that have already started (same

        cost as a normal call, no extra charge). For a dedicated in-play endpoint

        that exposes live-tagged player props alongside game lines, see

        `/v1/sports/{sport_key}/live`.


        **Shape tokens:** `?include=slim` drops `raw_json` from any row that

        carries one. `?include=raw` returns the identifying fields plus the

        `bookmakers` tree and `raw_json`, dropping derived fields

        (`canonical_event_id`, `sport_title`, `probable_pitchers`,

        `starting_lineups`). Events on this endpoint do not currently carry a

        `raw_json` field, so `slim` returns the same fields as `normalized` here

        and `raw` differs from `normalized` only by the derived fields it drops.


        **Verified-at signal:** every bookmaker''s `last_update` is the freshest of

        (price-change, no-change verification heartbeat). On hot-cycle sources

        (Pinnacle, FanDuel) that means a maximum age around the 2-second poll

        interval, even if the price hasn''t moved. Add `?include=verification` to

        also receive:

        - `verified_at`: the heartbeat timestamp (we polled and saw the same price)

        - `line_changed_at`: the last actual price-move timestamp

        - `is_current`: true iff verified_at is within the last 5 seconds


        Combine with shape tokens, e.g. `?include=slim,verification`.


        **Example:** `GET /v1/sports/soccer_epl/odds?regions=eu&markets=h2h,spreads&bookmakers=pinnacle`'
      operationId: get_odds_v1_sports__sport_key__odds_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: regions
        in: query
        required: false
        schema:
          type: string
          description: 'Comma-separated: us,us2,uk,eu,au. Default ''us''. iter_047 #420: was previously required (...). Made optional with ''us'' default so consumers running pre-existing The-Odds-API-style code (which defaulted to us) don''t 422.'
