  /v1/sports/{sport_key}/middles:
    get:
      summary: Find Middles
      description: 'Find middle opportunities across bookmakers. 3 credits.


        A *middle* is when you bet the Over at a low line on one book and the Under

        at a higher line on another, so there is a window of whole numbers where

        BOTH bets cash. Example: Over 7.5 runs at DraftKings and Under 9.5 at

        FanDuel; if the game lands on 8 or 9, both tickets win, otherwise you win

        one and lose the other for a small net cost (the vig).


        Unlike arbitrage (guaranteed profit), a middle is a small known cost for a

        shot at a large payout when the result lands in the window. This scans

        every over/under market with a numeric line, so it covers game totals,

        spreads, AND player-total props (points, rebounds, strikeouts, ...).


        Each result carries the window, the exact numbers that hit, the payout if

        it hits (per $100 on each leg), and the net cost if it misses above or

        below the window, so you can size the play yourself. Sorted widest-window

        first (best chance the result lands in the middle).


        **Example:** `GET /v1/sports/baseball_mlb/middles?min_gap=1`'
      operationId: find_middles_v1_sports__sport_key__middles_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: min_gap
        in: query
        required: false
        schema:
          type: number
          maximum: 50.0
          minimum: 0.0
          description: Minimum middle-window width in points/runs/goals (default 1.0). A middle needs at least one whole number strictly inside the window to cash both sides, so 1.0 is the practical floor.
          default: 1.0
          title: Min Gap
        description: Minimum middle-window width in points/runs/goals (default 1.0). A middle needs at least one whole number strictly inside the window to cash both sides, so 1.0 is the practical floor.
      - name: min_books
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Minimum distinct books across the group (default 2).
          default: 2
          title: Min Books
        description: Minimum distinct books across the group (default 2).
      - name: markets
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: CSV of market_keys to limit the scan (e.g. markets=totals for game totals only, or markets=player_points). Omit to scan game totals, spreads, AND player-total props.
          title: Markets
        description: 'CSV of market_keys to limit the scan (e.g. markets=totals for game totals only, or markets=player_points). Omit to scan game totals, spreads, AND player-total props. Repeating this parameter is the same as the comma form: ?markets=h2h&markets=spreads and ?markets=h2h,spreads are one request, billed identically, and return the union. A value repeated across occurrences is counted once.'
