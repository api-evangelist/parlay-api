          - type: 'null'
          description: Comma-separated bookmaker keys (overrides regions)
          title: Bookmakers
        description: 'Comma-separated bookmaker keys (overrides regions) Repeating this parameter is the same as the comma form: ?markets=h2h&markets=spreads and ?markets=h2h,spreads are one request, billed identically, and return the union. A value repeated across occurrences is counted once.'
        style: form
        explode: false
      - name: eventIds
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated event IDs
          title: Eventids
        description: Comma-separated event IDs
      - name: commenceTimeFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Commencetimefrom
      - name: commenceTimeTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Commencetimeto
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Shortcut: events whose commence_time falls on this UTC date (YYYY-MM-DD). Sugar for commenceTimeFrom=<date>T00:00:00Z and commenceTimeTo=<date>T23:59:59Z. Explicit commenceTime* values win.'
          title: Date
        description: 'Shortcut: events whose commence_time falls on this UTC date (YYYY-MM-DD). Sugar for commenceTimeFrom=<date>T00:00:00Z and commenceTimeTo=<date>T23:59:59Z. Explicit commenceTime* values win.'
      - name: include
        in: query
        required: false
        schema:
          type: string
          description: 'Comma-separated. Shape tokens: normalized (default, every field we build), slim (drops raw_json from any row that carries one), raw (the identifying fields plus the bookmakers tree and raw_json, dropping derived fields such as canonical_event_id, sport_title, probable_pitchers and starting_lineups). Events on this endpoint do not currently carry a raw_json field, so slim returns the same fields as normalized here and raw differs only by the derived fields it drops. Add ''verification'' to include verified_at, line_changed_at, and is_current per bookmaker.'
          default: normalized
          title: Include
        description: 'Comma-separated. Shape tokens: normalized (default, every field we build), slim (drops raw_json from any row that carries one), raw (the identifying fields plus the bookmakers tree and raw_json, dropping derived fields such as canonical_event_id, sport_title, probable_pitchers and starting_lineups). Events on this endpoint do not currently carry a raw_json field, so slim returns the same fields as normalized here and raw differs only by the derived fields it drops. Add ''verification'' to include verified_at, line_changed_at, and is_current per bookmaker.'
      - name: verified
        in: query
        required: false
        schema:
          type: boolean
          description: Alias for include=verification. Adds verified_at, line_changed_at, and is_current per bookmaker.
          default: false
          title: Verified
        description: Alias for include=verification. Adds verified_at, line_changed_at, and is_current per bookmaker.
      - name: live
        in: query
        required: false
        schema:
          type: boolean
          description: Live games only (commence_time at or before now). Equivalent to passing commenceTimeTo=<now>. No extra cost.
          default: false
          title: Live
        description: Live games only (commence_time at or before now). Equivalent to passing commenceTimeTo=<now>. No extra cost.
      - name: include_live
        in: query
        required: false
        schema:
