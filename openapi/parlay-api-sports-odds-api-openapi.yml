  /v1/sports/{sport_key}/props:
    get:
      summary: Get Props
      description: 'Get player prop odds from 10+ sources. 3 credits.


        Sourced from DraftKings, FanDuel, Caesars, Bovada, Pinnacle, Fliff (real

        American odds), PrizePicks, Underdog, Betr, Pick6, Sleeper, Novig, ProphetX,

        Polymarket (event markets, opt-in via include_event_markets=true).


        **Freshness.** Active books are polled every few seconds; the poll cadence

        per source runs ~30-120s depending on the book. This endpoint serves the

        most recent row per book written within the last 60 minutes, so a quiet

        market can return a line several minutes old. Every row (and every entry in

        a grouped `books[]`) carries `age_seconds`, the real age of that write. To

        enforce a tighter window pass `?maxAgeSec=` (e.g. `?maxAgeSec=120` for

        props no older than two minutes); rows past the bound, and rows whose write

        time can''t be parsed, are dropped.


        **Supported sports:** NFL, NBA, MLB, NHL, MMA/UFC, Soccer, Tennis, Golf, and more.


        **Market keys:** player_points, player_rebounds, player_assists, player_three_pointers,

        player_strikeouts, player_hits, player_home_runs, player_total_bases, player_runs,

        player_rbis, player_goals, player_shots_on_goal, player_pts_rebs_asts, and 50+ more.


        **Example:** `GET /v1/sports/basketball_nba/props?markets=player_points,player_rebounds`


        **Filter by player:** `?player=LeBron`


        **Filter by book:** `?bookmakers=fliff,pinnacle`


        **Polymarket / Kalshi event markets:** `?bookmakers=polymarket` (auto-includes

        event markets) or `?include_event_markets=true` (any source). For a dedicated

        prediction-market endpoint with question text + event_url, use

        `/v1/prediction-markets/{sport_key}`.


        **Pagination headers** (sleep_iter_7 #508): every response carries

        `x-result-page-size`, `x-result-row-count`, `x-result-limit`,

        `x-result-offset`, `x-result-has-more`. When `x-result-has-more: true`, the

        response also carries `x-next-offset: ` showing the offset to request

        for the next page. Use these to walk a large result set without truncating

        silently. The default limit of 5000 is fine for most queries; a

        full bet365 baseball_mlb response needs ~3 pages of 5000 to retrieve

        all available rows.


        **Pagination with `grouped=true`:** `limit` and `offset` count ROWS (one row

        per book) in both modes, so `x-next-offset` means the same thing either way.

        A grouped page therefore returns FEWER entries than `limit` - several rows

        collapse into one prop - and `x-result-page-size` (props returned) will sit

        below `x-result-row-count` (rows behind them). Trust `x-result-has-more`,

        not the entry count, to decide whether to ask for another page. A prop whose

        books straddle a page boundary arrives with a partial `books[]` on each

        page; merge pages on (event_id, player, market_key, line). To avoid that

        entirely, narrow with `?markets=` / `?bookmakers=` so the whole result fits

        in one page.


        Returns over/under lines with American odds from each source.'
      operationId: get_props_v1_sports__sport_key__props_get
      parameters:
      - name: sport_key
        in: path
        required: true
        schema:
          type: string
          title: Sport Key
      - name: markets
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated prop market keys (e.g. player_pass_yds,player_points)
          title: Markets
        description: 'Comma-separated prop market keys (e.g. player_pass_yds,player_points) Repeating this parameter is the same as the comma form: ?markets=h2h&markets=spreads and ?markets=h2h,spreads are one request, billed identically, and return the union. A value repeated across occurrences is counted once.'
        style: form
        explode: false
      - name: bookmakers
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated bookmaker keys
          title: Bookmakers
        description: 'Comma-separated bookmaker keys Repeating this parameter is the same as the comma form: ?markets=h2h&markets=spreads and ?markets=h2h,spreads are one request, billed identically, and return the union. A value repeated across occurrences is counted once.'
        style: form
        explode: false
      - name: player
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by player name (partial match)
          title: Player
        description: Filter by player name (partial match)
      - name: eventId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by event ID
          title: Eventid
        description: Filter by event ID
      - name: oddsFormat
        in: query
        required: false
        schema:
          type: string
          default: american
          title: Oddsformat
      - name: dfsOdds
        in: query
        required: false
        schema:
          type: string
          description: 'DFS normalization: ''midpoint'' = +100/-100 (default, zero-vig), ''effective'' = per-book implied (PrizePicks/Underdog = -137/-137)'
          default: midpoint
          title: Dfsodds
        description: 'DFS normalization: ''midpoint'' = +100/-100 (default, zero-vig), ''effective'' = per-book implied (PrizePicks/Underdog = -137/-137)'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Max rows returned (default 5000, max 10000)
          default: 5000
          title: Limit
        description: Max rows returned (default 5000, max 10000)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          description: Page offset within the result set. Combine with limit for pagination. For results past 10000 rows, narrow via ?markets= or ?bookmakers= filters instead.
          default: 0
          title: Offset
        description: Page offset within the result set. Combine with limit for pagination. For results past 10000 rows, narrow via ?markets= or ?bookmakers= filters instead.
      - name: grouped
        in: query
        required: false
        schema:
          type: boolean
          description: Return one entry per prop with a books[] array (recommended) instead of one row per book
          default: false
          title: Grouped
        description: Return one entry per prop with a books[] array (recommended) instead of one row per book
      - name: include_event_markets
        in: query
        required: false
        schema:
          type: boolean
          description: Include futures and prediction-market rows that lack a single home/away_team (Polymarket yes/no questions, Underdog season-longs, etc). Auto-enabled when bookmakers includes 'polymarket'.
          default: false
          title: Include Event Markets
        description: Include futures and prediction-market rows that lack a single home/away_team (Polymarket yes/no questions, Underdog season-longs, etc). Auto-enabled when bookmakers includes 'polymarket'.
      - name: maxAgeSec
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 3600
            minimum: 1
          - type: 'null'
          description: Only return prop rows written within this many seconds. Every row already carries age_seconds; this drops any older than the bound (and any whose write time can't be parsed). Omit to serve the full recency window (up to 3600s / 60 min).
          title: Maxagesec
        description: Only return prop rows written within this many seconds. Every row already carries age_seconds; this drops any older than the bound (and any whose write time can't be parsed). Omit to serve the full recency window (up to 3600s / 60 min).
      - name: include
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Accepted only as 'normalized', which is what this endpoint already returns. /props serves one shape, so any other token (for example 'raw' or 'slim') is rejected with 400 instead of being ignored. The shape tokens live on GET /v1/sports/{sport_key}/odds.
          title: Include
        description: Accepted only as 'normalized', which is what this endpoint already returns. /props serves one shape, so any other token (for example 'raw' or 'slim') is rejected with 400 instead of being ignored. The shape tokens live on GET /v1/sports/{sport_key}/odds.
      responses:
