name: ParlayAPI
description: Real-time sports odds aggregation API covering 30+ sportsbooks and
  sources — regulated US books, DFS apps, betting exchanges, and prediction
  markets (Kalshi, Polymarket) — across 92 sport keys, with player props,
  historical closing lines from 2005, arbitrage/EV/middles scanning, devig and
  parlay calculators, WebSocket/SSE streaming, webhooks, an official MCP server,
  and programmatic agent signup. Drop-in replacement for the-odds-api v4. Free
  tier 1,000 credits/month; public display and redistribution rights are not
  included.
